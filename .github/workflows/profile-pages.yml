name: Refresh profile data and deploy Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Check out the selected main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Collect public GitHub statistics
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run stats:update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate refreshed profile before bot commit
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          npm run check
          npm run build
          npm test
          npm run check:budget

      - name: Commit only generated profile data when it changed
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git add -- README.md data/github-stats.json public/assets/github-languages.svg
          if git diff --cached --quiet; then
            echo "No generated profile changes to commit."
          else
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: refresh public GitHub profile stats"
            git push origin HEAD:refs/heads/main
          fi

      - name: Select the exact revision to deploy
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-and-deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.revision }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check types, profile facts and README parity
        run: npm run check

      - name: Build static site
        run: npm run build
        env:
          PUBLIC_BUILD_REVISION: ${{ needs.prepare.outputs.revision }}

      - name: Run tests
        run: npm test

      - name: Check JavaScript transfer budget
        run: npm run check:budget

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
