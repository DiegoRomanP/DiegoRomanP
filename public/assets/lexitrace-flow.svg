<svg xmlns="http://www.w3.org/2000/svg" width="760" height="322" viewBox="0 0 760 322" role="img" aria-labelledby="title description">
  <title id="title">Esquema funcional de LexiTrace</title>
  <desc id="description">Un PDF seleccionado alimenta una consulta; la respuesta se acompaña de citas al documento, la página y el fragmento.</desc>
  <rect width="760" height="322" rx="18" fill="#f2f0e9" />
  <path d="M42 45h676" stroke="#c9c7bd" stroke-width="1" />
  <text x="42" y="31" fill="#5c615d" font-family="system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="1.4">ESQUEMA FUNCIONAL · NO ES UNA CAPTURA DE LA APLICACIÓN</text>
  <rect x="36" y="94" width="188" height="162" rx="12" fill="#faf9f6" stroke="#c9c7bd" />
  <text x="56" y="124" fill="#14746d" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">01 / MATERIAL</text>
  <path d="M60 149h44l17 17v54H60z" fill="#e5eee9" stroke="#14746d" stroke-width="1.5" />
  <path d="M104 149v18h17M70 179h39M70 191h31M70 203h26" fill="none" stroke="#14746d" stroke-linecap="round" stroke-width="2" />
  <text x="137" y="177" fill="#151515" font-family="system-ui, sans-serif" font-size="19" font-weight="650">PDF</text>
  <text x="137" y="202" fill="#62625b" font-family="system-ui, sans-serif" font-size="14">seleccionado</text>
  <path d="M238 175h42m-11-11 11 11-11 11" fill="none" stroke="#14746d" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
  <rect x="292" y="94" width="188" height="162" rx="12" fill="#faf9f6" stroke="#c9c7bd" />
  <text x="312" y="124" fill="#14746d" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">02 / CONSULTA</text>
  <rect x="312" y="148" width="148" height="74" rx="8" fill="#e5eee9" />
  <text x="328" y="178" fill="#151515" font-family="system-ui, sans-serif" font-size="16">Pregunta sobre</text>
  <text x="328" y="201" fill="#151515" font-family="system-ui, sans-serif" font-size="16">el documento</text>
  <path d="M494 175h42m-11-11 11 11-11 11" fill="none" stroke="#14746d" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
  <rect x="548" y="94" width="176" height="162" rx="12" fill="#faf9f6" stroke="#c9c7bd" />
  <text x="568" y="124" fill="#14746d" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">03 / RESPUESTA</text>
  <text x="568" y="158" fill="#151515" font-family="system-ui, sans-serif" font-size="17" font-weight="650">Respuesta</text>
  <rect x="568" y="174" width="132" height="58" rx="7" fill="#e5eee9" />
  <text x="580" y="194" fill="#14746d" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Cita vinculada</text>
  <text x="580" y="210" fill="#62625b" font-family="system-ui, sans-serif" font-size="12">
    <tspan x="580" y="210">documento · página</tspan>
    <tspan x="580" y="224">· fragmento</tspan>
  </text>
  <text x="42" y="292" fill="#62625b" font-family="system-ui, sans-serif" font-size="15">Los pasos resumen el alcance del MVP: consultar PDFs seleccionados y revisar las citas.</text>
</svg>
