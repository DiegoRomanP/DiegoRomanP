<svg xmlns="http://www.w3.org/2000/svg" width="320" height="460" viewBox="0 0 320 460" role="img" aria-labelledby="title description">
  <title id="title">Esquema funcional de LexiTrace en tres pasos</title>
  <desc id="description">Un PDF seleccionado alimenta una consulta; la respuesta se acompaña de citas al documento, la página y el fragmento. No es una captura de la aplicación.</desc>
  <rect width="320" height="460" rx="16" fill="#f2f0e9" />
  <path d="M20 62h280" stroke="#c9c7bd" stroke-width="1" />
  <text x="20" y="27" fill="#14746d" font-family="system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="1">ESQUEMA FUNCIONAL</text>
  <text x="20" y="48" fill="#62625b" font-family="system-ui, sans-serif" font-size="14">No es una captura de la aplicación</text>
  <rect x="20" y="78" width="280" height="78" rx="10" fill="#faf9f6" stroke="#c9c7bd" />
  <text x="38" y="103" fill="#14746d" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1">01 / MATERIAL</text>
  <path d="M40 116h17l8 8v20H40z" fill="#e5eee9" stroke="#14746d" stroke-width="1.3" />
  <path d="M57 116v8h8M45 131h15M45 136h11" fill="none" stroke="#14746d" stroke-linecap="round" stroke-width="1.5" />
  <text x="80" y="137" fill="#151515" font-family="system-ui, sans-serif" font-size="18" font-weight="650">PDF seleccionado</text>
  <path d="M160 163v15m-6-6 6 6 6-6" fill="none" stroke="#14746d" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
  <rect x="20" y="186" width="280" height="78" rx="10" fill="#faf9f6" stroke="#c9c7bd" />
  <text x="38" y="211" fill="#14746d" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1">02 / CONSULTA</text>
  <text x="38" y="242" fill="#151515" font-family="system-ui, sans-serif" font-size="18" font-weight="650">Pregunta sobre el documento</text>
  <path d="M160 271v15m-6-6 6 6 6-6" fill="none" stroke="#14746d" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
  <rect x="20" y="294" width="280" height="112" rx="10" fill="#faf9f6" stroke="#c9c7bd" />
  <text x="38" y="320" fill="#14746d" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1">03 / RESPUESTA</text>
  <text x="38" y="347" fill="#151515" font-family="system-ui, sans-serif" font-size="18" font-weight="650">Respuesta con cita</text>
  <rect x="38" y="360" width="244" height="30" rx="6" fill="#e5eee9" />
  <text x="49" y="380" fill="#14746d" font-family="system-ui, sans-serif" font-size="14" font-weight="650">documento · página · fragmento</text>
  <text x="20" y="428" fill="#62625b" font-family="system-ui, sans-serif" font-size="14">
    <tspan x="20" y="428">PDFs seleccionados · MVP local</tspan>
    <tspan x="20" y="446">Sin asesoría legal</tspan>
  </text>
</svg>
